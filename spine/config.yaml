# Spine configuration — edit paths and model as needed

user:
  title: "Sir"

spine:
  name: "Spine"
  model: "qwen2.5:7b"  # Run: ollama pull qwen2.5:7b

paths:
  memory: "../memory"
  conversations: "../memory/conversations"
  knowledge: "../memory/knowledge"
  chroma: "../memory/chroma"
  logs: "../logs"

chat:
  max_history_messages: 20  # Recent turns kept in context

knowledge:
  embed_model: "nomic-embed-text"  # Run: ollama pull nomic-embed-text
  chunk_size: 800
  chunk_overlap: 100
  top_k: 4

pc:
  max_organize_files: 100

voice:
  stt_model: "base"           # faster-whisper model: tiny, base, small
  stt_device: "cuda"          # cuda or cpu
  tts_voice: "en-GB-RyanNeural"
  record_seconds: 6
  sample_rate: 16000
  input_device: default       # or "pixel buds" / device index from 'devices'
  output_device: default
  auto_bluetooth: true        # auto-pick Pixel Buds / hands-free mic
  min_peak: 0.003              # lower = better for quiet bluetooth mics
  conversational: true        # after wake: continuous talk like executive assistant

visual:
  orb_size: 48                 # small — about Windows taskbar icon size
  always_on_top: true
  position: top-left

wake:
  enabled: true
  start_asleep: true          # visual/startup: silent until "Spine, wake up"
  sleep_timeout_seconds: 90   # auto-sleep after idle
  sleep_listen_seconds: 2     # short listens while sleeping
