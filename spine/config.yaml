# Spine — local voice assistant + multi-LLM brain

user:
  title: "Sir"

spine:
  name: "Spine"
  model: "qwen2.5:7b"

models:
  primary: "qwen2.5:7b"
  fast: "phi3:mini"
  routing:
    chat: primary
    pc: fast
    research: primary
    study: primary
    planner: fast
    files: fast

paths:
  memory: "memory"
  conversations: "memory/conversations"
  knowledge: "memory/knowledge"
  chroma: "memory/chroma"
  logs: "logs"

chat:
  max_history_messages: 20

knowledge:
  embed_model: "nomic-embed-text"
  chunk_size: 800
  chunk_overlap: 100
  top_k: 4
  auto_index_on_startup: true

voice:
  stt_model: "tiny"
  stt_device: "cuda"
  tts_voice: "en-GB-RyanNeural"
  record_seconds: 7
  sample_rate: 16000
  listen_mode: fixed
  min_peak: 0.0008

visual:
  orb_size: 48
  always_on_top: true
  position: top-left
  tray_icon: true

pc:
  unrestricted: true
  auto_control: true
  screen_control: true

scheduler:
  enabled: true
  check_interval_seconds: 60

boot:
  enabled: true
  single_instance: true
  wait_for_ollama: true
  ollama_timeout_seconds: 90
  audio_warmup_seconds: 12
  preload_whisper: true

host:
  scan_on_startup: false
