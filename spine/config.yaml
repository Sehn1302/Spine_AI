# Spine configuration — edit paths and model as needed

user:
  title: "Sir"

spine:
  name: "Spine"
  model: "qwen2.5:7b"  # Run: ollama pull qwen2.5:7b

paths:
  memory: "../memory"
  conversations: "../memory/conversations"
  knowledge: "../memory/knowledge"
  chroma: "../memory/chroma"
  logs: "../logs"

chat:
  max_history_messages: 20  # Recent turns kept in context

knowledge:
  embed_model: "nomic-embed-text"  # Run: ollama pull nomic-embed-text
  chunk_size: 800
  chunk_overlap: 100
  top_k: 4

pc:
  max_organize_files: 100

voice:
  stt_model: "base"           # faster-whisper model: tiny, base, small
  stt_device: "cuda"          # cuda or cpu
  tts_voice: "en-GB-RyanNeural"
  record_seconds: 6
  sample_rate: 16000
  input_device: default       # or device name / index from 'devices'
  output_device: default
  auto_bluetooth: true        # auto-use any connected Bluetooth / wireless headset
  prefer_enhanced_audio: true # use noise-cancelling mics (Armoury Crate, NVIDIA Broadcast, etc.)
  noise_cancellation: true    # software VAD — filters noise, keeps your voice
  listen_mode: continuous    # copilot-style: listens until you stop speaking
  silence_stop_seconds: 1.0   # stop after this many seconds of silence
  max_utterance_seconds: 25   # max length per phrase
  conversation_min_peak: 0.003 # sensitive mic pickup while awake
  min_peak: 0.004              # fallback for fixed-length mode
  passive_min_peak: 0.005       # wake phrase sensitivity
  boot_use_default_mic: true    # after reboot use Windows default mic first
  conversational: true        # after wake: continuous talk like executive assistant

visual:
  orb_size: 48                 # small — about Windows taskbar icon size
  always_on_top: true
  position: top-left

wake:
  enabled: true
  start_asleep: true          # silent until "Spine, wake up"
  sleep_timeout_seconds: 90   # auto-sleep after idle
  sleep_listen_seconds: 3     # short listens while sleeping
  phrases:                    # ONLY these phrases wake Spine
    - "spine wake up"
    - "spine wakeup"
    - "spine, wake up"

host:
  scan_on_startup: true       # detect installed software on this PC
  cache_path: "../memory/host_capabilities.json"
  rescan_hours: 24            # re-scan after this many hours
